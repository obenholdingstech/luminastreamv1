# P4c — one-time R2 provisioning (manual trigger only).
#
# Creates the avatar buckets for production and staging — NOTHING more; the
# binding arrives when the follow-up PR commits it into wrangler.jsonc (a
# deploy must never reference a binding before the thing behind it exists —
# the D1 rule, applied to its second storage). Runs on workflow_dispatch
# because bucket CREATION is an infrastructure act, not a deploy.
#
# Safe to re-run: create is skipped when the bucket already exists, and
# concurrent runs are serialized (CodeRabbit, PR 92) so two runs cannot both
# miss the existence check and race the create.
#
# Uses the same CLOUDFLARE_API_TOKEN as the deploy workflow. If that token
# lacks R2 permissions this job fails with a 403 — the fix is a one-time
# token-permission edit in the Cloudflare dashboard (CEO's hands: credential
# scoping is a human wall). Bucket names are not secrets; they grant nothing
# without account auth.

name: Provision R2 (avatars)

on:
  workflow_dispatch:

# Serialize manual runs; never cancel one mid-create.
concurrency:
  group: provision-r2
  cancel-in-progress: false

# The Cloudflare token does the work; keep the GITHUB_TOKEN read-only.
permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    # workflow_dispatch can be pointed at ANY branch, and a non-main revision
    # controls this file — so the job refuses to run off main at all
    # (CodeRabbit, PR 92). Defense in depth: the production environment's
    # deployment-branch policy should ALSO be restricted to main in repo
    # settings (Settings → Environments → production → Deployment branches)
    # — a one-click CEO action, queued in notes.md.
    if: github.ref == 'refs/heads/main'
    # Same environment discipline as the deploy + secrets workflows: the
    # credentials resolve under "production", and any reviewer gate the CEO
    # adds there covers infrastructure acts too.
    environment: production
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes; a persisted GitHub token in .git/config
          # would only be something for a dependency script to find.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No Cloudflare credentials in scope here — dependency lifecycle
      # scripts must have nothing to find (CodeRabbit, PR 92; the same
      # step-scoping push-auth-secrets.yml got at PR 88).
      - run: npm ci || npm install
      - name: Create buckets (skip when they exist)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          existing=$(npx wrangler r2 bucket list)
          for name in luminastream-avatars luminastream-avatars-staging; do
            if printf '%s\n' "$existing" | grep -Eq "^name:[[:space:]]*$name$"; then
              echo "$name already exists — skipping create"
            else
              npx wrangler r2 bucket create "$name"
            fi
          done
      - name: List buckets (names are NOT secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket list
