# Realignment — push the FOUR auth-era secrets to the production Worker.
# Manual trigger only. Exists because the CEO's machine hit a path error and
# the CTO's wrangler cannot authenticate to her Cloudflare account — but the
# CI deploy token can, and these four values already live in GitHub's
# encrypted secrets (mirrored from secrets.env through a pipe, never a
# terminal).
#
# Scope is DELIBERATELY narrow: the five human-set secrets (LiveKit, admin
# password, session secret) are NOT here — CI never sees them, per the
# standing rule in scripts/put-worker-secrets.sh. The four auth secrets are
# REQUIRED (the job fails before any upload if one is missing — a run that
# quietly skipped GOOGLE_CLIENT_ID would leave production half-configured);
# the Turnstile pair is OPTIONAL until both GitHub secrets exist, and is
# validated as a pair — one key without the other is a misconfiguration,
# not a partial rollout.

name: Push auth secrets (production)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    # The same protected environment the production deploy uses — approval
    # rules configured there gate this job too.
    environment: production
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Put secrets (values flow stdin → wrangler, never argv or logs)
        # Cloudflare credentials live on THIS step only — npm ci above runs
        # dependency postinstall hooks (esbuild, workerd), and a job-level
        # token would be readable by every one of them.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # Preflight: the four auth secrets are REQUIRED — fail before the
          # first upload rather than leave production half-configured.
          missing=""
          for name in ADMIN_EMAILS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ZEPTOMAIL_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::required secret(s) missing from GitHub:${missing} — nothing was uploaded"
            exit 1
          fi
          # Turnstile is optional but atomic: one key without the other is a
          # misconfiguration (server enforcing with no widget, or widget with
          # no verifier), not a partial rollout.
          if { [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; } || \
             { [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET_KEY" ]; }; then
            echo "::error::TURNSTILE keys must be set as a PAIR — nothing was uploaded"
            exit 1
          fi
          names="ADMIN_EMAILS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ZEPTOMAIL_TOKEN"
          [ -n "$TURNSTILE_SITE_KEY" ] && names="$names TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY"
          for name in $names; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --env=""
            echo "set: $name"
          done
