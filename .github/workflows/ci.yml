name: CI

# Until this file existed, NOTHING ran on a pull request. The two deploy
# workflows are `push: branches: [main]` only, so the first automated opinion on
# a change arrived after it had already merged — and the frontend deploy formed
# that opinion without running a single test.
#
# That gap is why PR #25 took nine rounds of external review to find twenty-five
# issues, six of them defects in the tests themselves. A review bot is a fine
# last line; it is a terrible first one.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here deploys, and nothing here needs a secret. A fork's PR
# gets exactly the same checks the branch does.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run. Deploys use the
# opposite policy deliberately (see deploy-*.yml) — a half-finished deploy is
# dangerous, a half-finished test run is only wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes src/lib/apiBase.build.test.js, which runs a REAL `vite build`
      # and asserts VITE_API_BASE reaches the bundle. That guard exists because
      # a refactor to dynamic env access would pass every other unit test and
      # still ship an empty API base to production. It needs the install above.
      - name: Unit tests
        run: node --test src/lib/*.test.js

      - name: Build
        run: npm run build

  worker:
    name: Worker — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Zero dependencies by design, so there is nothing to install. The Worker
      # hand-rolls its HS256 signing precisely so this stays true.
      - name: Worker tests
        working-directory: workers/api
        run: node --test

  agent:
    name: Agent — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 3.12 to match the VPS, NOT the 3.9 of the Mac harness. Running the suite
      # on an interpreter production does not use would test a configuration
      # nobody ships — and requirements.txt branches on the version marker
      # (aiohttp 3.14.1 needs >= 3.10), so the two interpreters genuinely
      # resolve to different dependency sets.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      # torch/onnxruntime/matplotlib make this the slow job. Installing the real
      # set anyway: a suite that skips the VAD tests because their dependency is
      # expensive is a suite that stops guarding the VAD.
      - name: Install
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        working-directory: agent
        run: python -m pytest -q

  deploy-script:
    name: Deploy script — bash harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Runs the REAL scripts/deploy-agent.sh against a throwaway git repo and a
      # stub python: 39 assertions covering the blue/green swap, the preflight
      # gate, the hold file, and the stray-agent scan. This is the code that
      # updates production unattended every two minutes, so it is the last thing
      # that should go unchecked on a PR.
      - name: Deploy harness
        run: bash scripts/test-deploy-agent.sh

      - name: Shell syntax
        run: |
          bash -n scripts/deploy-agent.sh
          bash -n scripts/test-deploy-agent.sh
          bash -n scripts/check-live.sh

      # A line beginning `#24` is an h1 with no space, not a reference to PR 24
      # (markdownlint MD018). Caught by review twice in two days — once in the
      # session log, once in the roadmap — which is the point at which a habit
      # stops being worth relying on and becomes worth checking. Narrow on
      # purpose: this is the one markdown mistake this project actually makes,
      # and a full markdownlint would arrive with a backlog nobody asked for.
      - name: Markdown — no PR reference parsed as a heading
        run: |
          if git grep -n --untracked -E '^#[0-9]' -- '*.md' ':!node_modules'; then
            echo "::error::A markdown line starts with '#<digit>' — that renders as a heading."
            echo "Write 'PR #24' or '(#24)' instead of starting the line with '#24'."
            exit 1
          fi
          echo "no PR references parsed as headings"
