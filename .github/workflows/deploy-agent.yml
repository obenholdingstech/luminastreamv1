name: Deploy Agent (VPS)

# The VPS was the last hand-driven surface in the project. Every merge touching
# agent/ used to require someone to remember to SSH in and pull — and the
# failure mode was silent: the box quietly ran stale code while a fix looked
# like it had shipped. That cost a full session of wrong conclusions once.
#
# Nobody holds a production credential in a chat window. The deploy key lives
# in GitHub secrets and is used only here.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/deploy-agent.sh"
      - ".github/workflows/deploy-agent.yml"
  # Manual re-deploy, for recovering after a hold or a failed run.
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race onto one box; let an in-flight one finish rather
# than killing it half-way through a restart.
concurrency:
  group: deploy-agent-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    # Create a GitHub Environment named "production" with required reviewers to
    # put a human approval in front of this.
    environment: production
    steps:
      # The agent test suite gates the deploy. A red suite must never reach the
      # box — same posture as the Worker workflow.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the VPS venv; the Mac venv is 3.9

      - name: Install agent dependencies
        working-directory: agent
        run: python -m pip install -q -r requirements.txt

      - name: Run the agent test suite
        working-directory: agent
        run: python -m pytest -q

      - name: Verify required secrets are present
        # Fail with a sentence a human can act on, rather than a confusing SSH
        # error 40 lines later.
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ]      || missing="$missing VPS_HOST"
          [ -n "$USER_NAME" ] || missing="$missing VPS_USER"
          [ -n "$KEY" ]       || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see scripts/deploy-agent.sh header and the README."
            exit 1
          fi

      - name: Configure SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            # Pinned host key: the deploy fails rather than trusting a
            # substituted host. Preferred.
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # No pin configured — accept on first use. Works, but a
            # man-in-the-middle would go unnoticed, so say so out loud.
            echo "::warning::VPS_KNOWN_HOSTS is not set; host key is unverified. Add it to pin the host."
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
        # The script lives in the repo and the box already has it after the
        # pull, so the remote command stays a one-liner. `bash -lc` picks up the
        # login environment the agent expects.
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            'bash -lc "cd ~/luminastreamv1 && git fetch origin --quiet && git switch main >/dev/null 2>&1 && git pull --ff-only origin main >/dev/null && bash scripts/deploy-agent.sh"'

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
